version: "3.9"

services:
    api:
        container_name: {{ cookiecutter.project_name }}_api
        build:
            context: .
            dockerfile: ./docker/local/django/Dockerfile
        command: /start
        volumes:
            - .:/app:z
            - static_volume:/app/staticfiles
            - media_volume:/app/media
            - jupyter_volume:/app/django-jupyter-notebooks
        # Internal API port, not exposed to host
        expose:
            - "8000"
        ports:
            - "8000:8000"  # Django
            - "8890:8890"  # Jupyter
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        depends_on:
            postgres:
                condition: service_healthy
            redis:
                condition: service_healthy
        healthcheck:
            test: ["CMD", "curl", "-f", "http://localhost:8000/health/"]
            interval: 30s
            timeout: 10s
            retries: 3
            start_period: 40s
        networks:
            - {{ cookiecutter.project_name }}

    client:
        container_name: {{ cookiecutter.project_name }}_client
        build:
            context: .
            dockerfile: ./docker/local/client/Dockerfile
        restart: on-failure
        volumes:
            - ./client:/app
            - /app/node_modules
        # Internal client port, not exposed to host
        expose:
            - "3000"
        env_file:
            - ./.envs/.local/.django
        environment:
            - NODE_ENV=development
            - WATCHPACK_POLLING=true
            - WDS_SOCKET_PORT=1337
            - CHOKIDAR_USEPOLLING=true
            - REACT_APP_API_URL=http://localhost:1337/api
        networks:
            - {{ cookiecutter.project_name }}

    postgres:
        container_name: {{ cookiecutter.project_name }}_postgres
        build:
            context: .
            dockerfile: ./docker/local/postgres/Dockerfile
        volumes:
            - local_postgres_data:/var/lib/postgresql/data
            - local_postgres_data_backups:/backups
        environment:
            - POSTGRES_USER=postgres
            - POSTGRES_PASSWORD=postgres
            - POSTGRES_DB=postgres
        ports:
            - "5432:5432"
        healthcheck:
            test: ["CMD-SHELL", "pg_isready -U postgres"]
            interval: 5s
            timeout: 5s
            retries: 5
            start_period: 10s
        networks:
            - {{ cookiecutter.project_name }}

    mailhog:
        container_name: {{ cookiecutter.project_name }}_mailhog
        image: mailhog/mailhog:v1.0.0
        ports:
            - "8025:8025"
        networks:
            - {{ cookiecutter.project_name }}
    
    redis:
        container_name: {{ cookiecutter.project_name }}_redis
        image: redis:7-alpine
        networks:
            - {{ cookiecutter.project_name }}
        healthcheck:
            test: ["CMD", "redis-cli", "ping"]
            interval: 10s
            timeout: 5s
            retries: 5
            start_period: 10s

    celery_worker:
        container_name: {{ cookiecutter.project_name }}_celery_worker
        build:
            context: .
            dockerfile: ./docker/local/django/Dockerfile
        command: /start-celeryworker
        volumes:
            - .:/app
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        depends_on:
            - mailhog
            - redis
            - postgres
        networks:
            - {{ cookiecutter.project_name }}
            
    flower:
        container_name: {{ cookiecutter.project_name }}_flower
        build:
            context: .
            dockerfile: ./docker/local/django/Dockerfile
        command: /start-flower
        volumes:
            - flower_data:/data
        env_file:
            - ./.envs/.local/.django
            - ./.envs/.local/.postgres
        depends_on:
            - redis
            - postgres
        ports:
            - "5555:5555"
        networks:
            - {{ cookiecutter.project_name }}

    nginx:
        container_name: {{ cookiecutter.project_name }}_nginx
        build:
            context: .
            dockerfile: ./docker/local/nginx/Dockerfile
        restart: always
        volumes:
            - static_volume:/app/staticfiles
            - media_volume:/app/mediafiles
        ports:
            - "1337:80"
        depends_on:
            - api
        networks:
            - {{ cookiecutter.project_name }}

networks:
    {{ cookiecutter.project_name }}:
        driver: bridge

volumes:
    static_volume:
    media_volume:
    jupyter_volume:
    local_postgres_data: {}
    local_postgres_data_backups: {}
    flower_data: {}
    django-jupyter-notebooks: {}
